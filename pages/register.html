<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>E_Wallet • Registro</title>
  <link rel="stylesheet" href="../styles/styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <img src="../assets/logo.svg" alt="E_Wallet Logo">
    </header>

    <main style="max-width:560px;margin:28px auto">
      <div class="card form-card">
        <h2>Crear cuenta</h2>
        <p style="color:var(--muted)">Regístrate en E_Wallet y empieza a gestionar tu saldo.</p>

        <div style="margin-top:12px">
          <div class="form-group">
            <label class="meta">Nombre completo</label>
            <input class="input" placeholder="Tu nombre completo" />
          </div>
          <div class="form-group">
            <label class="meta">Correo electrónico</label>
            <input class="input" placeholder="tu@correo.com" />
          </div>
          <div class="form-group">
            <label class="meta">Contraseña</label>
            <input class="input" placeholder="Crea una contraseña segura" type="password" />
          </div>

          <div style="display:flex;justify-content:center;margin-top:12px">
            <button class="btn btn-primary" style="min-width:220px">Crear cuenta</button>
          </div>

          <div style="margin-top:12px" class="footer">Al registrarte aceptas los términos y condiciones.</div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
