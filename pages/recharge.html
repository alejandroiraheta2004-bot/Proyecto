<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>E_Wallet • Recargar Saldo</title>
  <link rel="stylesheet" href="../styles/styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <img src="../assets/logo.svg" alt="E_Wallet Logo">
    </header>

    <main style="margin-top:18px">
      <div class="card form-card" style="max-width:480px;margin:auto">
        <h2>Simular Recarga de Saldo</h2>
        <p style="color:var(--muted)">Ingresa los detalles de la recarga.</p>

        <div style="margin-top:12px">
          <div style="background:#f2f6f6;padding:12px;border-radius:10px;text-align:center;margin-bottom:12px">
            <div style="color:var(--muted)">Saldo Actual</div>
            <div style="font-weight:800;font-size:20px">$1,250.50</div>
          </div>

          <div class="form-group">
            <label class="meta">Monto a recargar</label>
            <input class="input" placeholder="$ 100.00" />
          </div>

          <div class="form-group">
            <label class="meta">Selecciona un método de pago</label>
            <select class="input">
              <option>Banco VirtualSol</option>
              <option>Tarjeta débito</option>
              <option>Tarjeta crédito</option>
            </select>
          </div>

          <div style="display:flex;justify-content:center;margin-top:10px">
            <button class="btn btn-primary" style="min-width:240px;padding:12px 18px">Recargar Ahora</button>
          </div>

          <div style="margin-top:14px">
            <div class="alert-success"><img src="../assets/icon-check.svg" style="vertical-align:middle;height:18px;margin-right:8px"> <span>¡Recarga exitosa! Tu nuevo saldo ha sido actualizado.</span></div>
          </div>

        </div>
      </div>

      <div class="footer">© 2025 E_Wallet</div>
    </main>
  </div>
</body>
</html>
