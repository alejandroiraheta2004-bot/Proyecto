<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>E_Wallet • Enviar Dinero</title>
  <link rel="stylesheet" href="../styles/styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <img src="../assets/logo.svg" alt="E_Wallet Logo">
    </header>

    <main style="margin-top:18px">
      <div class="card form-card" style="max-width:920px;margin:auto">
        <h2>Enviar Dinero</h2>
        <p style="color:var(--muted)">Envía dinero de forma rápida y segura a otros usuarios.</p>

        <div style="margin-top:18px">
          <div class="form-group">
            <label class="meta">¿A quién le envías?</label>
            <input class="input" placeholder="Nombre, email o usuario" />
          </div>

          <div class="form-group">
            <label class="meta">Monto</label>
            <input class="input" placeholder="$ 0.00" />
          </div>

          <div class="form-group">
            <label class="meta">Añadir un mensaje (opcional)</label>
            <textarea class="input" rows="4" placeholder="Para la cena, regalo, etc."></textarea>
          </div>

          <div style="display:flex;justify-content:center;margin-top:18px">
            <button class="btn btn-primary" style="min-width:280px; padding:14px 20px; font-size:16px">Enviar Dinero</button>
          </div>

          <div style="margin-top:18px;display:flex;gap:12px;align-items:center;justify-content:center">
            <div class="alert-success" style="max-width:520px;display:none"><img src="../assets/icon-check.svg" style="vertical-align:middle;height:18px;margin-right:8px"> <span>¡Envío realizado! La transacción fue exitosa.</span></div>
            <div class="alert-error" style="max-width:520px;display:none"><img src="../assets/icon-error.svg" style="vertical-align:middle;height:18px;margin-right:8px"> <span>Error en la transacción. Intenta de nuevo.</span></div>
          </div>
        </div>
      </div>

      <div class="footer">© 2025 E_Wallet</div>
    </main>
  </div>
</body>
</html>
